name: API CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # --ignore-unknown-format: common.yaml has no `openapi` header, the custom rules still check it.
      - run: npx --yes @stoplight/spectral-cli@6.17.0 lint '[!.]*.yaml' --fail-severity=warn --ignore-unknown-format
