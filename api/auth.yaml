openapi: 3.1.0

info:
  title: Auth
  version: 0.1.0
  description: |
    Registration, login and logout, based on the `SESSION` cookie.

    Clients register themselves and always get the `CLIENT` role. Accounts with other roles
    are not created through this API.

servers:
  - url: http://localhost:8081/v1
    description: Local

security:
  - sessionAuth: []

tags:
  - name: Authentication
    description: Registration, login, logout and the current user.

paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a new client account
      description: |
        Creates an account with the `CLIENT` role and logs the user in.

        The email is unique case-insensitively.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/RegisterRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/RegisteredResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/EmailTakenError'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntityError'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in
      description: |
        Authenticates the user and creates a session.

        A wrong email and a wrong password give the same `401` (`INVALID_CREDENTIALS`),
        so the response does not reveal which accounts exist.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/LoginRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/LoggedInResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '403':
          $ref: '#/components/responses/AccountSuspendedError'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntityError'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Log out
      description: |
        Ends the current session and removes the session cookie.
        The operation is idempotent: without a session it also returns `204`.
      security: []
      responses:
        '204':
          $ref: '#/components/responses/LoggedOutResponse'

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the current user
      description: |
        Returns the authenticated user. The frontend calls it on startup to check whether
        the session is still active.
      x-roles: [CLIENT, CAREGIVER, CONTRACTOR, CONSULTANT, ADMIN]
      responses:
        '200':
          $ref: '#/components/responses/CurrentUserResponse'
        '401':
          $ref: 'common.yaml#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    sessionAuth:
      $ref: 'common.yaml#/components/securitySchemes/sessionAuth'

  headers:
    SessionSetCookie:
      description: Sets the `SESSION` cookie. The `XSRF-TOKEN` cookie is set in the same response.
      schema:
        type: string

    SessionClearedSetCookie:
      description: Removes the `SESSION` cookie.
      schema:
        type: string

  requestBodies:
    RegisterRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterInput'

    LoginRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginInput'

  responses:
    RegisteredResponse:
      description: Account created, the user is logged in.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SessionSetCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUser'

    LoggedInResponse:
      description: Authenticated.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SessionSetCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUser'

    LoggedOutResponse:
      description: Logged out.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SessionClearedSetCookie'

    CurrentUserResponse:
      description: The current user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUser'

    EmailTakenError:
      description: An account with this email already exists (`EMAIL_TAKEN`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
          examples:
            emailTaken:
              value:
                code: EMAIL_TAKEN
                message: Konto z tym adresem email już istnieje.

    InvalidCredentialsError:
      description: Wrong email or password (`INVALID_CREDENTIALS`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              value:
                code: INVALID_CREDENTIALS
                message: Niepoprawny email lub hasło.

    AccountSuspendedError:
      description: The account is suspended (`ACCOUNT_SUSPENDED`).
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorResponse'
          examples:
            accountSuspended:
              value:
                code: ACCOUNT_SUSPENDED
                message: Konto zostało zawieszone.

  schemas:
    Role:
      type: string
      enum: [CLIENT, CAREGIVER, CONTRACTOR, CONSULTANT, ADMIN]
      examples:
        - CLIENT

    RegisterInput:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - phone
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples:
            - anna.kowalska@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          examples:
            - Zielony-Rower-42
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Anna
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Kowalska
        phone:
          type: string
          pattern: '^\+?[0-9]{9,15}$'
          maxLength: 16
          examples:
            - '+48123456789'

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples:
            - anna.kowalska@example.com
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          examples:
            - Zielony-Rower-42

    CurrentUser:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - phone
        - roles
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          examples:
            - 123
        email:
          type: string
          format: email
          maxLength: 254
          examples:
            - anna.kowalska@example.com
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Anna
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Kowalska
        phone:
          type: string
          pattern: '^\+?[0-9]{9,15}$'
          maxLength: 16
          examples:
            - '+48123456789'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
          examples:
            - [CLIENT]
