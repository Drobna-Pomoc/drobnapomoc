spring:
  application:
    name: drobnapomoc
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres

server:
  port: 8081
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
      timeout: 30m

openapi:
  auth:
    base-path: /v1
