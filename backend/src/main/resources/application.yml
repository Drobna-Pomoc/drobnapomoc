spring:
  application:
    name: drobnapomoc
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  http:
    clients:
      read-timeout: 6s
  ai:
    ollama:
      chat:
        model: qwen2.5:3b
        temperature: 0.2
        num-predict: 64
    retry:
      max-attempts: 0

server:
  port: 8081
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
      timeout: 30m

openapi:
  auth:
    base-path: /v1

drobnapomoc:
  service-request:
    expiry: 14d
  price-estimate:
    enabled: false
    timeout: 5s
