sonar.organization=drobna-pomoc
sonar.projectKey=Drobna-Pomoc_drobnapomoc
sonar.projectName=drobnapomoc

# Sonar scans the whole repo by default; skip binaries it can't read as text
sonar.exclusions=**/*.png,**/*.jpg,**/*.svg,**/*.ico,**/*.jar

# Backend
sonar.java.source=25
sonar.java.binaries=backend/build/classes/java/main
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml

# Frontend
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Entry points only bootstrap the app, and tests shouldn't count towards their own coverage
sonar.coverage.exclusions=backend/src/main/java/**/*Application.java,frontend/src/main.tsx,backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Make the CI job wait for the quality gate and fail if it doesn't pass
sonar.qualitygate.wait=true
